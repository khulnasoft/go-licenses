name: 'app-pipeline'

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.set-go-version.outputs.go_version }}
    steps:
      - name: Set Go version
        id: set-go-version
        run: echo "go_version=1.21.x" >> $GITHUB_OUTPUT

  test:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.21.x' ]
        platform: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go dependencies
        id: cache-go
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Install dependencies
        if: steps.cache-go.outputs.cache-hit != 'true'
        run: make bootstrap

      - name: Run Static Analysis
        run: make lint

      - name: Run Tests
        run: make test

  build-artifacts:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'

      - name: Cache Go dependencies
        id: cache-go-build
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-build-

      - name: Install dependencies
        if: steps.cache-go-build.outputs.cache-hit != 'true'
        run: make bootstrap

      - name: Build snapshot artifacts
        run: make ci-build-snapshot-packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: dist

  test-artifacts:
    needs: build-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            name: "Linux"
            command: "make ci-test-linux-run"
          - platform: macos-latest
            name: "Mac"
            command: "make ci-test-mac-run"
          - platform: windows-latest
            name: "Windows"
            command: "make ci-test-windows-run"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: dist

      - name: Test ${{ matrix.name }} run
        run: ${{ matrix.command }}

  release:
    needs: [test, build-artifacts, test-artifacts]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'

      - name: Cache Go dependencies
        id: cache-go-release
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-release-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-release-

      - name: Install dependencies
        if: steps.cache-go-release.outputs.cache-hit != 'true'
        run: make bootstrap

      - name: Publish GitHub release
        run: make ci-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
